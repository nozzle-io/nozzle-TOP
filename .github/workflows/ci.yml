name: Build & Package

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'release' }}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: cmake -B build && cmake --build build --config Release

      - name: Verify plugins
        run: |
          for plugin in NozzleSend.plugin NozzleReceive.plugin; do
            if [ ! -d "plugin/$plugin" ]; then
              echo "Missing: plugin/$plugin"
              exit 1
            fi
            binary="plugin/$plugin/Contents/MacOS/$(basename "$plugin" .plugin)"
            if [ -f "$binary" ]; then
              archs=$(lipo -info "$binary" 2>&1)
              echo "$archs"
              echo "$archs" | grep -q "x86_64 arm64" || { echo "Not universal: $plugin"; exit 1; }
            fi
            echo "OK: $plugin"
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: plugin/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: cmake -B build && cmake --build build --config Release

      - name: Verify plugins
        shell: bash
        run: |
          for dll in NozzleSend.dll NozzleReceive.dll; do
            if [ ! -f "plugin/$dll" ]; then
              echo "Missing: plugin/$dll"
              exit 1
            fi
            echo "OK: $dll"
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: plugin/

  package:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS plugins
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: dist/${{ github.event.repository.name }}/plugin-macos/

      - name: Download Windows plugins
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: dist/${{ github.event.repository.name }}/plugin-windows/

      - name: Assemble package
        run: |
          NAME="${{ github.event.repository.name }}"
          cp LICENSE "dist/$NAME/" 2>/dev/null || true
          cp README.md "dist/$NAME/" 2>/dev/null || true

      - name: Create archive
        run: |
          cd dist
          zip -r "${{ github.event.repository.name }}.zip" "${{ github.event.repository.name }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-latest
          path: dist/*.zip

      - name: Upload latest development snapshot
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest development snapshot
          prerelease: true
          body: |
            Development snapshot from main.
            Commit: ${{ github.sha }}
          files: dist/*.zip

      - name: Upload versioned release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
