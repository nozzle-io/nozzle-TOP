name: Build & Package

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'release' }}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: cmake -B build && cmake --build build --config Release

      - name: Verify plugins
        run: |
          for plugin in NozzleSend.plugin NozzleReceive.plugin; do
            if [ ! -d "plugin/$plugin" ]; then
              echo "Missing: plugin/$plugin"
              exit 1
            fi
            binary="plugin/$plugin/Contents/MacOS/$(basename "$plugin" .plugin)"
            if [ -f "$binary" ]; then
              archs=$(lipo -info "$binary" 2>&1)
              echo "$archs"
              echo "$archs" | grep -q "x86_64 arm64" || { echo "Not universal: $plugin"; exit 1; }
            fi
            echo "OK: $plugin"
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: plugin/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: cmake -B build && cmake --build build --config Release

      - name: Verify plugins
        shell: bash
        run: |
          for dll in NozzleSend.dll NozzleReceive.dll; do
            if [ ! -f "plugin/$dll" ]; then
              echo "Missing: plugin/$dll"
              exit 1
            fi
            echo "OK: $dll"
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: plugin/

  package:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare package metadata
        id: meta
        run: |
          repo="${{ github.event.repository.name }}"
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base="${repo}-${GITHUB_REF_NAME}"
            channel="versioned"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            base="${repo}-latest-${short_sha}"
            channel="latest"
          elif [[ "${GITHUB_REF}" == refs/heads/stable ]]; then
            base="${repo}-stable-${short_sha}"
            channel="stable"
          else
            base="${repo}-ci-${short_sha}"
            channel="ci"
          fi
          echo "package_root=${base}" >> "$GITHUB_OUTPUT"
          echo "package_name=${base}.zip" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Download macOS plugins
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: dist/${{ steps.meta.outputs.package_root }}/plugin-macos/

      - name: Download Windows plugins
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: dist/${{ steps.meta.outputs.package_root }}/plugin-windows/

      - name: Assemble package
        run: |
          root="dist/${{ steps.meta.outputs.package_root }}"
          install -D LICENSE "$root/LICENSE"
          install -D README.md "$root/README.md"

      - name: Verify package contents
        run: |
          root="dist/${{ steps.meta.outputs.package_root }}"
          test -f "$root/LICENSE"
          test -f "$root/README.md"
          test -d "$root/plugin-macos/NozzleSend.plugin"
          test -d "$root/plugin-macos/NozzleReceive.plugin"
          test -f "$root/plugin-windows/NozzleSend.dll"
          test -f "$root/plugin-windows/NozzleReceive.dll"

      - name: Create archive
        run: |
          cd dist
          zip -r "${{ steps.meta.outputs.package_name }}" "${{ steps.meta.outputs.package_root }}/"

      - name: Verify archive
        run: |
          archive="dist/${{ steps.meta.outputs.package_name }}"
          unzip -l "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/plugin-macos/NozzleSend.plugin/'
          unzip -l "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/plugin-windows/NozzleSend.dll'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package_root }}
          path: dist/${{ steps.meta.outputs.package_name }}

      - name: Check versioned release asset does not exist
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="${{ steps.meta.outputs.package_name }}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > existing-assets.txt 2>/dev/null; then
            if grep -Fx "$asset" existing-assets.txt; then
              echo "versioned release asset already exists: $asset" >&2
              exit 1
            fi
          else
            echo "No existing release for ${GITHUB_REF_NAME}; upload may create it."
          fi

      - name: Upload latest development snapshot
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest development snapshot
          prerelease: true
          body: |
            Development snapshot from main.
            Commit: ${{ github.sha }}
          files: dist/${{ steps.meta.outputs.package_name }}

      - name: Upload versioned release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.package_name }}
